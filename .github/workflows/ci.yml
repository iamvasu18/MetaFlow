name: MetaFlow CI

on:
  push:
    branches:
      - main
      - stage2-ci-observability
      - stage2-observability
      - stage2-hosting-cd
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metaflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend regression and replay
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: Salesforce AI

    env:
      PYTHON_DOTENV_DISABLED: "1"
      APP_DATABASE_URL: ""
      APP_DATABASE: /tmp/metaflow-ci/accounts.sqlite3
      APP_REDIS_URL: ""
      APP_JOB_MODE: embedded
      APP_BACKGROUND_JOBS: "false"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: Salesforce AI/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Salesforce AI/tools/lwc/package-lock.json

      - name: Install LWC checker
        working-directory: Salesforce AI/tools/lwc
        run: npm ci

      - name: Check LWC tooling dependencies
        working-directory: Salesforce AI/tools/lwc
        run: npm audit --audit-level=high

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run backend regression tests
        run: >
          python -m pytest
          Backend/AI/app/tests/test_background_jobs.py
          Backend/AI/app/tests/test_deploy_result_identity.py
          Backend/AI/app/tests/test_stage1_trust.py
          Backend/AI/app/tests/test_stage2c_storage.py
          Backend/AI/app/tests/test_workspace_regression.py
          Backend/AI/app/tests/test_salesforce_api_discovery.py
          Backend/AI/app/tests/test_flow_activation.py
          Backend/AI/app/tests/test_metadata_api_transport.py
          Backend/AI/app/tests/test_repair_reliability.py
          Backend/AI/app/tests/test_hosting.py
          Backend/AI/app/tests/test_oauth_connection.py
          Backend/AI/app/tests/test_multi_provider.py
          Backend/AI/app/tests/test_demo_hosting.py
          -q

      - name: Run replay evaluations
        run: >
          python -m evaluations.run
          --mode replay
          --output evaluation-results.json

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: Salesforce AI/Frontend

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Salesforce AI/Frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Check dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  container:
    name: Render container build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build hosting image
        run: docker build -t metaflow-ci "Salesforce AI"
      - name: Verify packaged runtimes and application
        run: docker run --rm --entrypoint python -e PYTHONPATH=/app metaflow-ci deployment/check_image.py
