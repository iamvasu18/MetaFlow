
name: MetaFlow CI

on:
  push:
    branches:
      - main
      - feature-source-updates
      - stage2-ci-observability
      - stage2-observability
      - stage2-hosting-cd

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metaflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  backend:
    name: Backend regression and replay
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: Salesforce AI

    env:
      PYTHON_DOTENV_DISABLED: "1"
      AI_PROVIDER: mock
      RUN_LIVE_AI_TESTS: "false"
      APP_DATABASE_URL: ""
      APP_DATABASE: /tmp/metaflow-ci/accounts.sqlite3
      APP_REDIS_URL: ""
      APP_JOB_MODE: embedded
      APP_BACKGROUND_JOBS: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: Salesforce AI/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Salesforce AI/tools/lwc/package-lock.json

      - name: Install LWC checker dependencies
        working-directory: Salesforce AI/tools/lwc
        run: npm ci

      - name: Audit LWC tooling dependencies
        working-directory: Salesforce AI/tools/lwc
        run: npm audit --audit-level=high

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run complete backend regression tests
        run: |
          python -m pytest Backend/AI/app/tests -q

      - name: Run replay evaluations
        run: |
          python -m evaluations.run \
            --mode replay \
            --output evaluation-results.json

      - name: Upload replay evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metaflow-replay-evaluations
          path: Salesforce AI/evaluation-results.json
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: Salesforce AI/Frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Salesforce AI/Frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: metaflow-frontend-build
          path: Salesforce AI/Frontend/dist
          if-no-files-found: warn
          retention-days: 7

  container:
    name: Render container build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build hosting Docker image
        run: |
          docker build \
            -t metaflow-ci \
            "Salesforce AI"

      - name: Verify packaged runtimes and application
        run: |
          docker run --rm \
            --entrypoint python \
            -e PYTHONPATH=/app \
            metaflow-ci \
            deployment/check_image.py
